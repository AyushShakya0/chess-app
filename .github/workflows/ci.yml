name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f671b9cdc0f2d3433363e357cb82cb0d90fb # v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@f111f330731532aafc3e400004e5811f1e72ba4c # v5.3.0
        with:
          go-version: "1.23"

      - name: Install dependencies
        run: npm ci

      - name: Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

      - name: Verify Go Server Compilation & Vet
        run: |
          cd server
          go vet ./...
          go build -v ./...
